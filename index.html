<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <center>
        <h1>Tic Tac Toe</h1>

        <div id="game">
            <div id="box">

                <div id="c1" onclick="playerclick('c1')"></div>
                <div id="c2" onclick="playerclick('c2')"></div>
                <div id="c3" onclick="playerclick('c3')"></div>

                <div id="c4" onclick="playerclick('c4')"></div>
                <div id="c5" onclick="playerclick('c5')"></div>
                <div id="c6" onclick="playerclick('c6')"></div>

                <div id="c7" onclick="playerclick('c7')"></div>
                <div id="c8" onclick="playerclick('c8')"></div>
                <div id="c9" onclick="playerclick('c9')"></div>

            </div>
        </div>

        <h2 id="result">Turn: X</h2>

        <button id="restart" onclick="restartGame()">
            Restart Game
        </button>

    </center>

    <script src="script.js"></script>

</body>
</html>
